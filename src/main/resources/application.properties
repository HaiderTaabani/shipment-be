spring.application.name=shipment

spring.datasource.url=jdbc:postgresql://localhost:5433/shipmentdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=shipment
spring.datasource.password=shipment

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

logging.level.com.example.shipmenttracker=DEBUG
logging.level.org.springframework.messaging=DEBUG